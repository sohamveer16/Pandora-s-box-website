<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep night sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#071326"/>
      <stop offset="75%" stop-color="#0b1e36"/>
      <stop offset="100%" stop-color="#040b17"/>
    </linearGradient>

    <!-- Moonlight glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d6f8ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Stained glass warm glow -->
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#e65100" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Cyan ground mist gradient -->
    <linearGradient id="mistGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#040b17" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Pale Celestial Moon -->
  <circle cx="1400" cy="220" r="160" fill="url(#moonGlow)" />
  <circle cx="1400" cy="220" r="54" fill="#e0f7fa" />
  <circle cx="1385" cy="210" r="14" fill="#b2ebf2" opacity="0.5" />
  <circle cx="1420" cy="235" r="22" fill="#b2ebf2" opacity="0.4" />

  <!-- Distant Mountains / Dark Forest Silhouette -->
  <path d="M0,680 L180,620 L350,650 L520,590 L700,640 L880,570 L1100,630 L1300,560 L1520,620 L1740,580 L1920,640 L1920,1080 L0,1080 Z" fill="#061221" opacity="0.8"/>

  <!-- Midground: Gothic Cathedral & Crypt Silhouettes -->
  <g fill="#071829">
    <!-- Church Tower 1 -->
    <rect x="260" y="340" width="180" height="420" />
    <polygon points="240,340 350,180 460,340" />
    <rect x="345" y="140" width="10" height="50" />
    <rect x="330" y="155" width="40" height="10" />

    <!-- Church Arched Windows with Warm Orange Glow -->
    <g>
      <rect x="300" y="380" width="36" height="70" rx="18" fill="url(#windowGlow)" stroke="#ff9800" stroke-width="2"/>
      <line x1="318" y1="380" x2="318" y2="450" stroke="#ffb74d" stroke-width="2"/>
      <line x1="300" y1="415" x2="336" y2="415" stroke="#ffb74d" stroke-width="2"/>

      <rect x="364" y="380" width="36" height="70" rx="18" fill="url(#windowGlow)" stroke="#ff9800" stroke-width="2"/>
      <line x1="382" y1="380" x2="382" y2="450" stroke="#ffb74d" stroke-width="2"/>
      <line x1="364" y1="415" x2="400" y2="415" stroke="#ffb74d" stroke-width="2"/>
    </g>

    <!-- Mausoleum Central Complex -->
    <rect x="800" y="420" width="320" height="340" />
    <polygon points="760,420 960,300 1160,420" />
    <!-- Pillars -->
    <rect x="830" y="440" width="28" height="320" fill="#0a2138"/>
    <rect x="910" y="440" width="28" height="320" fill="#0a2138"/>
    <rect x="980" y="440" width="28" height="320" fill="#0a2138"/>
    <rect x="1060" y="440" width="28" height="320" fill="#0a2138"/>
    <!-- Mausoleum Crypt Archway -->
    <path d="M920,760 L920,540 Q960,500 1000,540 L1000,760 Z" fill="#020810" />
  </g>

  <!-- Ancient Monolith Stones (Left & Right) -->
  <g fill="#0b1b2d" stroke="#163554" stroke-width="3">
    <!-- Left Monolith Stone -->
    <path d="M120,860 L140,460 Q190,420 230,470 L260,860 Z" />
    <line x1="160" y1="520" x2="220" y2="540" stroke="#00f3ff" stroke-width="2" opacity="0.6"/>
    <line x1="170" y1="580" x2="210" y2="600" stroke="#00f3ff" stroke-width="2" opacity="0.6"/>
    
    <!-- Right Monolith Stone -->
    <path d="M1660,860 L1690,440 Q1740,410 1790,450 L1820,860 Z" />
    <line x1="1710" y1="500" x2="1770" y2="530" stroke="#00f3ff" stroke-width="2" opacity="0.6"/>
    <line x1="1720" y1="570" x2="1760" y2="590" stroke="#00f3ff" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Foreground Gravestones & Dark Forest Shrubbery -->
  <g fill="#040c17">
    <!-- Gravestone 1 -->
    <path d="M480,840 L480,680 Q510,650 540,680 L540,840 Z" />
    <!-- Gravestone Cross -->
    <rect x="620" y="660" width="16" height="120" />
    <rect x="590" y="690" width="76" height="16" />

    <!-- Gravestone 2 -->
    <path d="M1240,840 L1240,670 Q1270,640 1300,670 L1300,840 Z" />
    <!-- Gravestone Cross 2 -->
    <rect x="1460" y="650" width="16" height="130" />
    <rect x="1430" y="680" width="76" height="16" />

    <!-- Ground silhouette with jagged pixelated vegetation -->
    <path d="M0,780 Q480,750 960,770 T1920,780 L1920,1080 L0,1080 Z" />
  </g>

  <!-- Ground Mystic Ambient Mist -->
  <rect x="0" y="650" width="1920" height="430" fill="url(#mistGrad)" />
</svg>
